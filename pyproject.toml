[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cost6krate-compress_jd197"
version = "0.1.0"
description = "从样本里推断模型压缩工程师·结构化输出的约束解码应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cost6krate" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cost6krate.github.io"
Repository = "https://github.com/cost6krate/compress_jd197"
Issues = "https://github.com/cost6krate/compress_jd197/issues"

[project.scripts]
compress_jd197 = "compress_jd197:main"

[tool.setuptools]
py-modules = ["compress_jd197"]
